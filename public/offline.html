<!doctype html>
<!-- İnternet olmayanda service worker (sw.js) bu səhifəni göstərir: tam müstəqildir (xarici fayl, şrift, skript yoxdur).
     Bağlantı qayıdanda istifadəçinin açmaq istədiyi səhifə özü yenilənir. web/public/offline.html ilə eynidir. -->
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06192b">
<title>Bağlantı yoxdur · Freeze Air Service</title>
<style>
  :root { color-scheme: dark; --bg: #0e1626; --surface: #151e31; --line: #26324a; --ink: #f0efec; --muted: #8d97ab; --primary: #3b8cf0; --frost: #8fe3ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(60vmax 60vmax at 15% -10%, rgba(59,140,240,.14), transparent 60%),
                radial-gradient(50vmax 50vmax at 110% 110%, rgba(31,181,127,.09), transparent 60%), var(--bg);
    color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  }
  @property --spin { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .card {
    position: relative; width: 100%; max-width: 420px; padding: 36px 28px 28px; text-align: center;
    background: var(--surface); border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 0 0 1px var(--line);
  }
  /* Giriş kartındakı kimi kənarda fırlanan işıq (yalnız çərçivədə) */
  .card::before {
    content: ""; position: absolute; inset: -1.5px; padding: 1.5px; border-radius: inherit; pointer-events: none;
    background: conic-gradient(from var(--spin), transparent 0 50%, rgba(59,140,240,.9) 68%, var(--frost) 78%, rgba(59,140,240,.9) 86%, transparent 96%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 4.5s linear infinite;
  }
  @keyframes spin { to { --spin: 360deg; } }
  .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; font-weight: 800; font-size: 15px; }
  .logo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--primary), var(--frost)); color: #fff; }
  .icon { position: relative; display: grid; place-items: center; width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%; background: rgba(59,140,240,.12); color: var(--frost); }
  .icon::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(143,227,255,.45); animation: ping 2.4s ease-out infinite; }
  @keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(1.55); opacity: 0; } }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  p { margin-top: 8px; color: var(--muted); font-size: 14px; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 46px; margin-top: 24px;
    border: 0; border-radius: 12px; background: var(--primary); color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    transition: background .2s, transform .1s;
  }
  button:hover { background: #2f74c9; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .7; cursor: progress; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 12.5px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff9f1c; box-shadow: 0 0 0 3px rgba(255,159,28,.18); }
  .tips { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); text-align: left; font-size: 13px; color: var(--muted); list-style: none; padding-left: 0; }
  .tips li { display: flex; gap: 8px; padding: 3px 0; }
  .tips li::before { content: "•"; color: var(--primary); font-weight: 800; }
  @media (prefers-reduced-motion: reduce) { .card::before, .icon::after { animation: none; } }
</style>
</head>
<body>
<main class="card" role="alert" aria-live="assertive">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/></svg>
    </span>
    Freeze Air Service
  </div>

  <div class="icon" aria-hidden="true">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M5 12.86a10 10 0 0 1 5.17-2.69M19 12.86a10 10 0 0 0-2.01-1.48M2 8.82a15 15 0 0 1 4.18-2.65M22 8.82a15 15 0 0 0-11.29-3.76M2 2l20 20"/></svg>
  </div>

  <h1>Şəbəkəyə qoşulu deyil</h1>
  <p>İnternet bağlantısı yoxdur. Bağlantı bərpa olunan kimi səhifə özü açılacaq.</p>

  <button id="retry" type="button">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5"/></svg>
    <span>Yenidən yoxla</span>
  </button>
  <div class="status"><span class="dot"></span><span id="msg">Bağlantı gözlənilir…</span></div>

  <ul class="tips">
    <li>Wi-Fi və ya mobil internetin açıq olduğunu yoxla</li>
    <li>Təyyarə rejimi açıqdırsa, söndür</li>
    <li>Modemi (routeri) yenidən başlatmağı sına</li>
  </ul>
</main>
<script>
  // Bağlantı qayıdanda (və ya düymə ilə yoxlananda) istifadəçinin açdığı səhifə yenidən yüklənir
  var btn = document.getElementById("retry"), msg = document.getElementById("msg"), busy = false;
  function check(manual) {
    if (busy) return;
    busy = true; btn.disabled = manual;
    if (manual) msg.textContent = "Yoxlanılır…";
    fetch(location.origin + "/robots.txt", { cache: "no-store", method: "HEAD" })
      .then(function () { if (location.pathname === "/offline.html") location.replace("/"); else location.reload(); })
      .catch(function () { msg.textContent = manual ? "Hələ də bağlantı yoxdur" : "Bağlantı gözlənilir…"; })
      .then(function () { busy = false; btn.disabled = false; });
  }
  btn.addEventListener("click", function () { check(true); });
  window.addEventListener("online", function () { check(false); });
  setInterval(function () { if (navigator.onLine) check(false); }, 5000);
</script>
</body>
</html>
